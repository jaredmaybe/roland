<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centered Image</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    img {
      display: block;
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <img src="https://preview.redd.it/higher-quality-version-of-that-one-roland-image-i-keep-v0-zpfjkarz8pkd1.jpeg?width=1080&crop=smart&auto=webp&s=ce360686adf8f291563b85de12099a5851fdbe09" alt="Roland image" />
</body>
</html>
